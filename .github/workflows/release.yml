name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (tag like v1.0.0, or branch like main)"
        required: false
        default: ""
      build_ohos:
        description: "Build OpenHarmony/HarmonyOS HAP"
        type: boolean
        default: true
      flutter_ohos_repo:
        description: "Flutter OHOS TPC repository URL"
        required: false
        default: "https://gitee.com/openharmony-sig/flutter_flutter.git"
      flutter_ohos_ref:
        description: "Flutter OHOS branch/tag/commit. Defaults to 3.22.1-ohos-0.1.0 for Dart 3."
        required: false
        default: "3.22.1-ohos-0.1.0"

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      is_tag: ${{ steps.resolve.outputs.is_tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.ref || 'main' }}

      - id: resolve
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            ref="${{ github.ref }}"
          else
            ref="${{ inputs.ref }}"
            if [[ -z "$ref" ]]; then
              ref="refs/heads/main"
            elif [[ "$ref" != refs/* ]]; then
              if [[ "$ref" == v* ]]; then
                ref="refs/tags/$ref"
              else
                ref="refs/heads/$ref"
              fi
            fi
          fi

          tag_name="$ref"
          tag_name="${tag_name#refs/tags/}"
          tag_name="${tag_name#refs/heads/}"

          is_tag="false"
          prerelease="false"
          if [[ "$ref" == refs/tags/v* ]]; then
            is_tag="true"
          else
            app_version="$(awk '/^version:/ {print $2}' simple_live_app/pubspec.yaml)"
            tag_name="v${app_version%%+*}"
            is_tag="true"
          fi
          if [[ "$tag_name" == *beta* || "$tag_name" == *alpha* || "$tag_name" == *pre* || "$tag_name" == *rc* ]]; then
            prerelease="true"
          fi

          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "is_tag=$is_tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  # ── Android ──
  android:
    needs: resolve
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Prepare Android keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_PASSWORD" && -n "$KEY_ALIAS" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | openssl base64 -d -A > simple_live_app/android/release-keystore.jks
            printf 'storeFile=../release-keystore.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > simple_live_app/android/key.properties
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.x"
          cache: true

      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          app_version="$(grep '^version:' simple_live_app/pubspec.yaml | awk '{print $2}')"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"

      - name: Build Android APK
        run: |
          cd simple_live_app
          flutter build apk --release

      - name: Rename APK
        id: apk_asset
        shell: bash
        run: |
          asset_path="simple_live_app/build/app/outputs/flutter-apk/simple_live_app-${{ steps.app_version.outputs.app_version }}-android.apk"
          cp simple_live_app/build/app/outputs/flutter-apk/app-release.apk "$asset_path"
          echo "asset_path=$asset_path" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ steps.apk_asset.outputs.asset_path }}

      - name: Upload to Release
        if: ${{ needs.resolve.outputs.is_tag == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag_name }}
          prerelease: ${{ needs.resolve.outputs.prerelease }}
          token: ${{ github.token }}
          fail_on_unmatched_files: false
          files: ${{ steps.apk_asset.outputs.asset_path }}

  # ── iOS ──
  ios:
    needs: resolve
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.x"
          cache: true

      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get

      - name: Build iOS
        run: |
          cd simple_live_app
          flutter build ios --release --no-codesign

      - name: Create unsigned IPA
        run: |
          cd simple_live_app
          mkdir -p build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/Runner.app
          cd build/ios/iphoneos/
          zip -q -r ios_no_sign.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: simple_live_app/build/ios/iphoneos/ios_no_sign.ipa

      - name: Upload to Release
        if: ${{ needs.resolve.outputs.is_tag == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag_name }}
          prerelease: ${{ needs.resolve.outputs.prerelease }}
          token: ${{ github.token }}
          fail_on_unmatched_files: false
          files: simple_live_app/build/ios/iphoneos/ios_no_sign.ipa

  # ── macOS ──
  macos:
    needs: resolve
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.x"
          cache: true

      - name: Enable Flutter Desktop
        run: flutter config --enable-macos-desktop

      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get

      - name: Install appdmg
        run: npm install -g appdmg

      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor

      - name: Build macOS
        id: build_macos
        continue-on-error: true
        run: |
          cd simple_live_app
          flutter_distributor package --platform macos --targets dmg,zip --skip-clean

      - name: Upload macOS to Artifacts
        if: ${{ steps.build_macos.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            simple_live_app/build/dist/*/*.dmg
            simple_live_app/build/dist/*/*.zip

      - name: Upload to Release
        if: ${{ steps.build_macos.outcome == 'success' && needs.resolve.outputs.is_tag == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag_name }}
          prerelease: ${{ needs.resolve.outputs.prerelease }}
          token: ${{ github.token }}
          fail_on_unmatched_files: false
          files: |
            simple_live_app/build/dist/*/*.dmg
            simple_live_app/build/dist/*/*.zip

  # ── Windows ──
  windows:
    needs: resolve
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.x"
          cache: true

      - name: Enable Flutter Desktop
        run: flutter config --enable-windows-desktop

      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get

      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor

      - name: Build Windows
        run: |
          cd simple_live_app
          flutter_distributor package --platform windows --targets zip --skip-clean

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            simple_live_app/build/dist/*/*.zip

      - name: Upload to Release
        if: ${{ needs.resolve.outputs.is_tag == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag_name }}
          prerelease: ${{ needs.resolve.outputs.prerelease }}
          token: ${{ github.token }}
          files: |
            simple_live_app/build/dist/*/*.zip

  # ── Linux ──
  linux:
    needs: resolve
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.x"
          cache: true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev libmpv-dev mpv

      - name: Enable Flutter Desktop
        run: flutter config --enable-linux-desktop

      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get

      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor

      - name: Build Linux
        run: |
          cd simple_live_app
          flutter_distributor package --platform linux --targets deb,zip --skip-clean

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            simple_live_app/build/dist/*/*.deb
            simple_live_app/build/dist/*/*.zip

      - name: Upload to Release
        if: ${{ needs.resolve.outputs.is_tag == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag_name }}
          prerelease: ${{ needs.resolve.outputs.prerelease }}
          token: ${{ github.token }}
          files: |
            simple_live_app/build/dist/*/*.deb
            simple_live_app/build/dist/*/*.zip

  # ---- OpenHarmony / HarmonyOS NEXT ----
  ohos:
    continue-on-error: true
    needs: resolve
    if: ${{ github.event_name == 'push' || inputs.build_ohos == true }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: ./.github/actions/setup-flutter-ohos
        with:
          flutter-ohos-repo: ${{ inputs.flutter_ohos_repo || vars.FLUTTER_OHOS_REPO || 'https://gitee.com/openharmony-sig/flutter_flutter.git' }}
          flutter-ohos-ref: ${{ inputs.flutter_ohos_ref || vars.FLUTTER_OHOS_REF || '3.22.1-ohos-0.1.0' }}
          ohos-sdk-url: ${{ secrets.OHOS_SDK_URL || vars.OHOS_SDK_URL }}
          pub-hosted-url: ${{ vars.PUB_HOSTED_URL }}
          flutter-storage-base-url: ${{ vars.FLUTTER_STORAGE_BASE_URL }}

      - name: Prepare OHOS pubspec
        shell: bash
        run: |
          cp simple_live_app/pubspec.yaml simple_live_app/pubspec.default.yaml
          cp simple_live_app/pubspec.ohos.yaml simple_live_app/pubspec.yaml
          rm -f simple_live_app/pubspec.lock

      - name: Restore packages
        shell: bash
        run: |
          cd simple_live_app
          flutter pub get

      - name: Build OHOS HAP
        shell: bash
        run: |
          cd simple_live_app
          build_help="$(flutter build --help 2>&1 || true)"
          if grep -Eq "(^|[[:space:]])hap([[:space:]]|$)" <<< "$build_help"; then
            hap_help="$(flutter build hap --help 2>&1 || true)"
            hap_args=()
            if grep -q -- "--release" <<< "$hap_help"; then
              hap_args+=(--release)
            fi
            if grep -q -- "--dart-define" <<< "$hap_help"; then
              hap_args+=(--dart-define=TARGET_OHOS=true)
            fi
            flutter build hap "${hap_args[@]}"
          else
            echo "Current Flutter OHOS SDK does not expose 'flutter build hap'; falling back to SDK/project hvigorw." >&2
            mkdir -p ohos/har
            if [[ ! -f ohos/har/flutter.har ]]; then
              flutter_har="$(find "$FLUTTER_ROOT" -type f -name flutter.har | sort | head -n 1 || true)"
              if [[ -z "$flutter_har" ]]; then
                echo "flutter.har was not found in FLUTTER_ROOT=$FLUTTER_ROOT." >&2
                exit 1
              fi
              cp "$flutter_har" ohos/har/flutter.har
            fi
            cd ohos
            if command -v ohpm >/dev/null 2>&1; then
              ohpm config set registry https://repo.harmonyos.com/ohpm/ || true
              ohpm install
            fi
            if [[ -x ./hvigorw ]]; then
              ./hvigorw assembleHap --mode module -p module=entry@default -p product=default
            elif command -v hvigorw >/dev/null 2>&1; then
              hvigorw assembleHap --mode module -p module=entry@default -p product=default
            elif [[ -x ./oh_modules/.bin/hvigorw ]]; then
              ./oh_modules/.bin/hvigorw assembleHap --mode module -p module=entry@default -p product=default
            elif [[ -x ./oh_modules/.bin/hvigor ]]; then
              ./oh_modules/.bin/hvigor assembleHap --mode module -p module=entry@default -p product=default
            elif [[ -f ./oh_modules/@ohos/hvigor/index.js ]]; then
              node ./oh_modules/@ohos/hvigor/index.js assembleHap --mode module -p module=entry@default -p product=default
            else
              echo "Neither flutter build hap nor an installed hvigor entrypoint is available." >&2
              echo "Check OHOS_SDK_URL and the OHOS command-line tools download." >&2
              exit 127
            fi
          fi

      - name: Collect HAP assets
        id: hap_assets
        shell: bash
        run: |
          app_version="$(awk '/^version:/ {print $2}' simple_live_app/pubspec.ohos.yaml)"
          out_dir="simple_live_app/build/ohos-artifacts"
          mkdir -p "$out_dir"
          mapfile -t haps < <(find simple_live_app -type f -name "*.hap" | sort)
          if [[ "${#haps[@]}" -eq 0 ]]; then
            echo "No .hap files found after OHOS build." >&2
            exit 1
          fi
          index=1
          for hap in "${haps[@]}"; do
            suffix=""
            if [[ "${#haps[@]}" -gt 1 ]]; then
              suffix="-$index"
            fi
            cp "$hap" "$out_dir/simple_live_app-${app_version}-ohos${suffix}.hap"
            index=$((index + 1))
          done
          echo "path=$out_dir/*.hap" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ohos
          path: ${{ steps.hap_assets.outputs.path }}

      - name: Upload to Release
        if: ${{ needs.resolve.outputs.is_tag == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag_name }}
          prerelease: ${{ needs.resolve.outputs.prerelease }}
          token: ${{ github.token }}
          fail_on_unmatched_files: false
          files: ${{ steps.hap_assets.outputs.path }}
