name: Setup Flutter OHOS
description: Set up Flutter OHOS TPC branch and OpenHarmony/HarmonyOS SDK for HAP builds.
inputs:
  flutter-ohos-repo:
    description: Flutter OHOS TPC repository URL.
    required: false
    default: https://gitee.com/openharmony-sig/flutter_flutter.git
  flutter-ohos-ref:
    description: Optional Flutter OHOS branch, tag or commit. Default uses the active Flutter OHOS dev branch.
    required: false
    default: "dev"
  ohos-sdk-url:
    description: URL(s) to OpenHarmony/HarmonyOS command-line SDK archive. Supports zip/tar.gz or whitespace-separated split archives.
    required: false
    default: ""
  ohos-commandline-tools-url:
    description: URL to OHOS command-line tools archive that provides ohpm.
    required: false
    default: "https://repo.huaweicloud.com/harmonyos/ohpm/5.0.2/oh-command-line-tools-20240715.zip"
  pub-hosted-url:
    description: Optional PUB_HOSTED_URL mirror.
    required: false
    default: ""
  flutter-storage-base-url:
    description: Optional FLUTTER_STORAGE_BASE_URL mirror.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install host dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y curl unzip git xz-utils zip libglu1-mesa

    - name: Configure mirrors
      shell: bash
      env:
        PUB_HOSTED_URL_INPUT: ${{ inputs.pub-hosted-url }}
        FLUTTER_STORAGE_BASE_URL_INPUT: ${{ inputs.flutter-storage-base-url }}
      run: |
        if [[ -n "$PUB_HOSTED_URL_INPUT" ]]; then
          echo "PUB_HOSTED_URL=$PUB_HOSTED_URL_INPUT" >> "$GITHUB_ENV"
        fi
        if [[ -n "$FLUTTER_STORAGE_BASE_URL_INPUT" ]]; then
          echo "FLUTTER_STORAGE_BASE_URL=$FLUTTER_STORAGE_BASE_URL_INPUT" >> "$GITHUB_ENV"
        fi

    - name: Install OHOS SDK
      shell: bash
      env:
        OHOS_SDK_URL_INPUT: ${{ inputs.ohos-sdk-url }}
        OHOS_COMMANDLINE_TOOLS_URL_INPUT: ${{ inputs.ohos-commandline-tools-url }}
      run: |
        sdk_root="$RUNNER_TEMP/ohos-sdk"
        if [[ -z "$OHOS_SDK_URL_INPUT" ]]; then
          echo "OHOS_SDK_URL is required for GitHub hosted runners." >&2
          echo "Set repository secret or variable OHOS_SDK_URL to DevEco/OpenHarmony SDK archive URL(s)." >&2
          echo "The hosted runner does not include ohpm/hvigorw/OpenHarmony SDK by default." >&2
          exit 1
        fi

        download_dir="$RUNNER_TEMP/ohos-sdk-download"
        mkdir -p "$sdk_root" "$download_dir"
        mapfile -t sdk_urls < <(printf '%s\n' "$OHOS_SDK_URL_INPUT" | awk '{ for (i = 1; i <= NF; i++) print $i }')
        if [[ "${#sdk_urls[@]}" -eq 0 ]]; then
          echo "OHOS_SDK_URL did not contain any downloadable URL." >&2
          exit 1
        fi

        for url in "${sdk_urls[@]}"; do
          file_name="${url%%\?*}"
          file_name="${file_name##*/}"
          if [[ -z "$file_name" || "$file_name" == "$url" ]]; then
            file_name="ohos-sdk-archive"
          fi
          echo "Downloading OHOS SDK part: $file_name"
          curl -fL --retry 3 "$url" -o "$download_dir/$file_name"
        done

        archive_path=""
        if compgen -G "$download_dir/*.zip" >/dev/null; then
          archive_path="$(find "$download_dir" -maxdepth 1 -type f -name '*.zip' | sort | head -n 1)"
          unzip -q "$archive_path" -d "$sdk_root"
        elif compgen -G "$download_dir/*.tar.gz" >/dev/null; then
          archive_path="$(find "$download_dir" -maxdepth 1 -type f -name '*.tar.gz' | sort | head -n 1)"
          tar -xzf "$archive_path" -C "$sdk_root"
        elif compgen -G "$download_dir/*.tar.gz.*" >/dev/null; then
          archive_path="$RUNNER_TEMP/ohos-sdk.tar.gz"
          cat $(find "$download_dir" -maxdepth 1 -type f -name '*.tar.gz.*' | sort) > "$archive_path"
          tar -xzf "$archive_path" -C "$sdk_root"
        else
          echo "Unsupported OHOS SDK archive format. Expected .zip, .tar.gz or split .tar.gz.* files." >&2
          find "$download_dir" -maxdepth 1 -type f -print >&2
          exit 1
        fi

        echo "OHOS_SDK_HOME=$sdk_root" >> "$GITHUB_ENV"
        echo "HOS_SDK_HOME=$sdk_root" >> "$GITHUB_ENV"
        echo "DEVECO_SDK_HOME=$sdk_root" >> "$GITHUB_ENV"

        while IFS= read -r dir; do
          echo "$dir" >> "$GITHUB_PATH"
          export PATH="$dir:$PATH"
        done < <(find "$sdk_root" -type d \( -name bin -o -name toolchains \) | sort)

        echo "SDK root: $sdk_root"
        echo "Detected OHOS command paths:"
        find "$sdk_root" -type f \( -name ohpm -o -name ohpm.bat -o -name hvigorw -o -name hvigorw.bat -o -name hvigor -o -name hvigor.bat \) | sort || true
        if command -v ohpm >/dev/null 2>&1; then ohpm --version || true; fi
        if command -v hvigorw >/dev/null 2>&1; then hvigorw --version || true; fi
        if command -v hvigor >/dev/null 2>&1; then hvigor --version || true; fi

        if [[ -n "$OHOS_COMMANDLINE_TOOLS_URL_INPUT" ]]; then
          tools_root="$RUNNER_TEMP/ohos-command-line-tools"
          mkdir -p "$tools_root"
          curl -fL --retry 3 "$OHOS_COMMANDLINE_TOOLS_URL_INPUT" -o "$RUNNER_TEMP/ohos-command-line-tools.zip"
          unzip -q "$RUNNER_TEMP/ohos-command-line-tools.zip" -d "$tools_root"
          while IFS= read -r dir; do
            echo "$dir" >> "$GITHUB_PATH"
            export PATH="$dir:$PATH"
          done < <(find "$tools_root" -type d -name bin | sort)

          echo "Detected OHOS command-line tool paths:"
          find "$tools_root" -type f \( -name ohpm -o -name ohpm.bat -o -name hvigorw -o -name hvigorw.bat -o -name hvigor -o -name hvigor.bat \) | sort || true
          find "$tools_root" -type f \( -name ohpm -o -name hvigorw -o -name hvigor \) -exec chmod +x {} \; || true
          if command -v ohpm >/dev/null 2>&1; then ohpm --version || true; fi
          if command -v hvigorw >/dev/null 2>&1; then hvigorw --version || true; fi
          if command -v hvigor >/dev/null 2>&1; then hvigor --version || true; fi
        fi

    - name: Install Flutter OHOS
      shell: bash
      env:
        FLUTTER_OHOS_REPO: ${{ inputs.flutter-ohos-repo }}
        FLUTTER_OHOS_REF: ${{ inputs.flutter-ohos-ref }}
      run: |
        flutter_root="$RUNNER_TEMP/flutter-ohos"
        git config --global http.version HTTP/1.1
        git config --global http.lowSpeedLimit 1000
        git config --global http.lowSpeedTime 60
        for attempt in 1 2 3; do
          rm -rf "$flutter_root"
          if [[ -n "$FLUTTER_OHOS_REF" ]]; then
            git clone --depth 1 --single-branch --branch "$FLUTTER_OHOS_REF" "$FLUTTER_OHOS_REPO" "$flutter_root" && break
          else
            git clone --depth 1 --single-branch "$FLUTTER_OHOS_REPO" "$flutter_root" && break
          fi
          if [[ "$attempt" == "3" ]]; then
            echo "Failed to clone Flutter OHOS after $attempt attempts." >&2
            exit 1
          fi
          echo "Flutter OHOS clone failed; retrying in $((attempt * 10)) seconds..." >&2
          sleep $((attempt * 10))
        done
        if [[ "$FLUTTER_OHOS_REF" == 3.22.* ]]; then
          git -C "$flutter_root" tag -f 3.22.0 HEAD || true
        fi
        echo "$flutter_root/bin" >> "$GITHUB_PATH"
        echo "FLUTTER_ROOT=$flutter_root" >> "$GITHUB_ENV"

    - name: Warm up Flutter OHOS
      shell: bash
      run: |
        flutter --version
        config_help="$(flutter config --help 2>&1 || true)"
        if grep -q -- "--enable-ohos" <<< "$config_help"; then
          flutter config --enable-ohos || true
        else
          echo "Current Flutter SDK does not expose 'flutter config --enable-ohos'; skipping."
        fi
        precache_help="$(flutter precache --help 2>&1 || true)"
        if grep -q -- "--ohos" <<< "$precache_help"; then
          flutter precache --ohos
        else
          echo "Current Flutter SDK does not expose 'flutter precache --ohos'; using default precache."
          flutter precache
        fi
        find "$FLUTTER_ROOT/bin/cache/artifacts" -type f -name flutter.har -print || true
        flutter doctor -v || true
