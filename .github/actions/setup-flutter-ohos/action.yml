name: Setup Flutter OHOS
description: Set up Flutter OHOS and the matching HarmonyOS command-line toolchain.
inputs:
  flutter-ohos-repo:
    description: Flutter OHOS TPC repository URL.
    required: false
    default: https://gitcode.com/openharmony-sig/flutter_flutter.git
  flutter-ohos-ref:
    description: Flutter OHOS branch, tag or commit.
    required: false
    default: "3.35.8-ohos-0.0.2"
  ohos-commandline-tools-version:
    description: HarmonyOS command-line tools build version.
    required: false
    default: "5.1.1.823"
  pub-hosted-url:
    description: Optional PUB_HOSTED_URL mirror.
    required: false
    default: ""
  flutter-storage-base-url:
    description: Optional FLUTTER_STORAGE_BASE_URL mirror.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install host dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y curl unzip git xz-utils zip libgl1-mesa-dev

    - name: Configure mirrors
      shell: bash
      env:
        PUB_HOSTED_URL_INPUT: ${{ inputs.pub-hosted-url }}
        FLUTTER_STORAGE_BASE_URL_INPUT: ${{ inputs.flutter-storage-base-url }}
      run: |
        if [[ -n "$PUB_HOSTED_URL_INPUT" ]]; then
          echo "PUB_HOSTED_URL=$PUB_HOSTED_URL_INPUT" >> "$GITHUB_ENV"
        fi
        if [[ -n "$FLUTTER_STORAGE_BASE_URL_INPUT" ]]; then
          echo "FLUTTER_STORAGE_BASE_URL=$FLUTTER_STORAGE_BASE_URL_INPUT" >> "$GITHUB_ENV"
        fi

    - name: Install HarmonyOS command-line tools
      id: setup-ohos
      uses: ErBWs/setup-ohos@4dbb63025116eb6165ceac58a4bf47cbdc5ac721
      with:
        version: ${{ inputs.ohos-commandline-tools-version }}
        cache: true

    - name: Configure HarmonyOS SDK environment
      shell: bash
      run: |
        echo "OHOS_SDK_HOME=$HOS_SDK_HOME" >> "$GITHUB_ENV"
        echo "DEVECO_SDK_HOME=$HOS_SDK_HOME" >> "$GITHUB_ENV"
        echo "HarmonyOS SDK: ${{ steps.setup-ohos.outputs.sdk-version }}"
        echo "HarmonyOS API: ${{ steps.setup-ohos.outputs.api-version }}"
        ohpm --version

    - name: Install Flutter OHOS
      shell: bash
      env:
        FLUTTER_OHOS_REPO: ${{ inputs.flutter-ohos-repo }}
        FLUTTER_OHOS_REF: ${{ inputs.flutter-ohos-ref }}
      run: |
        flutter_root="$RUNNER_TEMP/flutter-ohos"
        git config --global http.version HTTP/1.1
        git config --global http.lowSpeedLimit 1000
        git config --global http.lowSpeedTime 60
        for attempt in 1 2 3; do
          rm -rf "$flutter_root"
          if git clone --depth 1 --single-branch --branch "$FLUTTER_OHOS_REF" "$FLUTTER_OHOS_REPO" "$flutter_root"; then
            break
          fi
          if [[ "$attempt" == "3" ]]; then
            echo "Failed to clone Flutter OHOS after $attempt attempts." >&2
            exit 1
          fi
          echo "Flutter OHOS clone failed; retrying in $((attempt * 10)) seconds..." >&2
          sleep $((attempt * 10))
        done
        echo "$flutter_root/bin" >> "$GITHUB_PATH"
        echo "FLUTTER_ROOT=$flutter_root" >> "$GITHUB_ENV"

    - name: Warm up Flutter OHOS
      shell: bash
      run: |
        flutter --version
        config_help="$(flutter config --help 2>&1 || true)"
        if grep -q -- "--enable-ohos" <<< "$config_help"; then
          flutter config --enable-ohos || true
        fi
        if grep -q -- "--ohos-sdk" <<< "$config_help"; then
          flutter config --ohos-sdk "$HOS_SDK_HOME" || true
        fi
        precache_help="$(flutter precache --help 2>&1 || true)"
        if grep -q -- "--ohos" <<< "$precache_help"; then
          flutter precache --ohos
        else
          flutter precache
        fi
        flutter doctor -v || true
